name: Refresh data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow numpy scipy py-near

      - name: Run pipeline
        run: python run_all.py

      - name: Verify data integrity
        run: python analysis/manifest.py verify

      - name: Anchor manifest hash on NEAR mainnet
        env:
          NEAR_ACCOUNT_ID: ${{ secrets.NEAR_ACCOUNT_ID }}
          NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
        run: python analysis/anchor.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/daily_metrics.parquet data/manifest.json data/model/forecast.json data/model/fee_switch.json data/model/frequency.json data/model/price_link.json docs/data/forecast.json docs/data/fee_switch.json docs/data/frequency.json docs/data/price_link.json
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "refresh data $(date -u +%Y-%m-%d)"
            git push origin main
          fi
